services:
  postgres:
    image: postgres:17-alpine
    container_name: ordershield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ordershield
      POSTGRES_PASSWORD: ordershield123
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordershield"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: ordershield-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ordershield
      RABBITMQ_DEFAULT_PASS: ordershield123
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  rabbitmq_data:
